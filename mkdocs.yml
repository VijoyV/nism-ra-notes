site_name: NISM-Series-XV Study Guide
site_url: https://vijoyv.github.io/nism-ra-notes/
site_author: Vijoy V
site_description: Comprehensive Study Guide and MCQ Question Bank for NISM-RA Exam 2026.

theme:
  name: material
  font:
    text: Roboto
    code: Roboto Mono
  palette:
    - media: "(prefers-color-scheme: light)"
      scheme: default
      primary: indigo
      accent: blue indigo
      toggle:
        icon: material/brightness-7
        name: Switch to dark mode
    - media: "(prefers-color-scheme: dark)"
      scheme: slate
      primary: indigo
      accent: blue indigo
      toggle:
        icon: material/brightness-4
        name: Switch to light mode

  features:
    - navigation.tabs
    - navigation.sections
    - navigation.expand
    - navigation.top
    - navigation.footer
    - navigation.tracking
    - toc.follow
    - content.code.copy
    - search.suggest
    - search.highlight

plugins:
  - search

markdown_extensions:
  - admonition
  - attr_list
  - pymdownx.details
  - pymdownx.superfences:
      custom_fences:
        - name: mermaid
          class: mermaid
          format: !!python/name:pymdownx.superfences.fence_code_format
  - pymdownx.tabbed:
      alternate_style: true
  - pymdownx.emoji:
      emoji_index: !!python/name:pymdownx.emoji.twemoji
      emoji_generator: !!python/name:pymdownx.emoji.to_svg
  - pymdownx.arithmatex:
      generic: true

extra_javascript:
  - javascripts/mathjax.js
  - https://unpkg.com/mathjax@3/es5/tex-mml-chtml.js

extra_css:
  - stylesheets/extra.css
  
nav: 
  - Home: index.md
  - "Study Material": 
      - "Chapter 1: Research Analyst Profession": chapter-01.md
      - "Chapter 2: Securities Market": 
          - "2.0 Overview": chapter-02.md
          - "2.1 Introduction to Security Market": chapter-02-part-01.md
          - "2.2 Product Definitions": 
            - "2.2.1 Equity Shares": chapter-02-part-02-section-1.md
            - "2.2.2 Debentures, Bonds and Notes": chapter-02-part-02-section-2.md
            - "2.2.3 Warrants": chapter-02-part-02-section-3.md
            - "2.2.4 Indices": chapter-02-part-02-section-4.md
            - "2.2.5 Mutual Fund Units": chapter-02-part-02-section-5.md
            - "2.2.6 Exchange Traded Funds -ETFs": chapter-02-part-02-section-6.md
            - "2.2.7 Hybrids / Structured Products": chapter-02-part-02-section-7.md
            - "2.2.8 Commodities": chapter-02-part-02-section-8.md
          - "2.3 Market Structure": chapter-02-part-03.md
          - "2.4 Participants": chapter-02-part-04.md
          - "2.5 Transactions": chapter-02-part-05.md
          - "2.6 Demat/Remat": chapter-02-part-06.md
      - "Chapter 3: Market Terminology": chapter-03.md
      - "Chapter 4: Fundamentals of Research": chapter-04.md
      - "Chapter 5: Economic Analysis": chapter-05.md
      - "Chapter 6: Industry Analysis": chapter-06.md
      - "Chapter 7: Company Analysis - Governance": chapter-07.md
      - "Chapter 8: Company Analysis - Financials": chapter-08.md
  - "Exam Engine":
      - "Chapterwise Quiz": quiz.md
  - "Reference":
    - "Vocabulary": ./references/vocab-and-terminology.md
    - "Financial Market Participants": ./references/participants-of-indian-financial-market.md
    - "Product Reference": ./references/indian-financial-market-products-quick-reference.md
  - "Test Page": test_page.md