site_name: NISM-Series-XV Study Guide
site_url: https://vijoyv.github.io/nism-ra-notes/
site_author: Vijoy V
site_description: Comprehensive Study Guide and MCQ Question Bank for NISM-RA Exam 2026.

theme:
  name: material
  # Professional Font Choice
  font:
    text: Roboto
    code: Roboto Mono
  # Color Palette with Auto-Switching Dark Mode
  palette:
    - media: "(prefers-color-scheme: light)"
      scheme: default
      primary: indigo
      accent: blue indigo
      toggle:
        icon: material/brightness-7
        name: Switch to dark mode
    - media: "(prefers-color-scheme: dark)"
      scheme: slate
      primary: indigo
      accent: blue indigo
      toggle:
        icon: material/brightness-4
        name: Switch to light mode

  # Advanced UI Features for a "Web App" feel
  features:
    - navigation.tabs              # Moves main categories to the top bar
    - navigation.sections          # Groups sidebar items for better hierarchy
    - navigation.expand            # Sidebar starts expanded
    - navigation.top               # Floating "Back to Top" button
    - navigation.footer            # "Next/Prev" buttons at bottom
    - navigation.tracking          # Updates URL as you scroll
    - toc.follow                   # Right-hand table of contents follows scroll
    - content.code.copy            # Adds a copy button to code/JSON blocks
    - search.suggest               # Live search suggestions
    - search.highlight             # Highlights search terms in text

plugins:
  - search

markdown_extensions:
  - admonition
  - attr_list                      # Allows custom CSS styling in markdown
  
  - pymdownx.arithmatex:
      generic: true
      
  - pymdownx.details               # Allows collapsible "Spoiler" blocks / hidden rationales
  
  - pymdownx.superfences:          # Handles code blocks AND Mermaid graphs cleanly
      custom_fences:
        - name: mermaid
          class: mermaid
          format: !!python/name:pymdownx.superfences.fence_code_format  
  
  - pymdownx.tabbed:
      alternate_style: true        # Enables content tabs for side-by-side comparisons

extra_javascript:
  - javascripts/mathjax.js
  - https://cdn.jsdelivr.net/npm/mathjax@3/es5/tex-mml-chtml.js

# Organized Navigation Structure
